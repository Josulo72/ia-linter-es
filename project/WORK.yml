schema_version: 1
blocks:
  - id: B1
    title: Base
    objective: Repositorio, contratos, modelo documental, Markdown, configuración, build y CI.
    depends_on: []
    deliverables:
      - packages/linter/src/contracts
      - packages/linter/src/document
      - packages/linter/src/markdown
      - packages/linter/src/config
      - .github/workflows/ci.yml
      - AGENTS.md, quality-policy.yml, project/*
    tests:
      - test/document.test.ts (BOM, CRLF, emojis, combinantes, offsets round-trip, Markdown AST)
      - test/config.test.ts (validación, búsqueda, precedencia)
    acceptance: typecheck y tests en verde; STATE.md actualizado.
    status: done

  - id: B2
    title: Motor
    objective: Detectores, compilador con seguridad de regex, runtime, scoring, supresiones, baseline.
    depends_on: [B1]
    deliverables:
      - src/rules/detectors, src/rules/compiler, src/rules/runtime
      - src/scoring, src/suppressions, src/baseline
      - schemas/rule.schema.json
    tests:
      - unitarios por detector; compilador rechaza patrones peligrosos; timing en 1 MB adversarial
      - scoring determinista y omisión con pocas palabras; supresiones Markdown; baseline por huellas
    acceptance: gates de regex y sin red en verde.
    status: done

  - id: B3
    title: Producto local
    objective: CLI, API, reporters, 24–30 reglas stable con fixtures y evidencia.
    depends_on: [B2]
    deliverables:
      - src/cli, src/api, src/reporters, src/runner
      - rules/definitions/*.yml (24–30 stable), rules/lexicons, rules/profiles, rules/evidence
      - docs/configuration.md, docs/rule-authoring.md
    tests:
      - integración runner (gitignore, caché, overrides); E2E CLI por comando; reporters JSON/SARIF estructurales
    acceptance: "`ia-linter-es lint` sobre examples/ produce salida determinista; rulepack compilado en build."
    status: done

  - id: B4
    title: Evidencia y voz humana
    objective: Corpus propio de registro cotidiano, guía de estilo por situación, reglas de los tics actuales, veto automatizado y benchmark reproducible.
    depends_on: [B3]
    deliverables:
      - corpus/policy/{sources,licenses,veto,prompts,prompts-v1.1}.yml, corpus/manifests/*.yml
      - benchmark/scripts/{fetch-human,fetch-foros,build-manifests,dump-findings}.mjs, scripts/corpus-check.mjs
      - integrations/claude-code/output-styles/humano.md (guía de estilo: la pieza principal)
      - perfiles chat, correo, readme y redes; reglas candidate de los tics actuales
      - benchmark/reports/{v1.0,v1.1}.md, docs/benchmark.md
    tests:
      - scripts/corpus-check.mjs sobre el corpus v1.1 y el archivado v1.0
      - benchmark run reproducible; comparación de la clase IA con guía y sin guía
    acceptance: >-
      informe publicado con métricas por regla y agregadas; holdout congelado antes de fijar pesos;
      la guía reduce de forma medible los tics en la clase IA.
    status: done
    notes: >-
      v1.0 (prosa formal) cerrada con resultado negativo y archivada en corpus/archive/v1.0.
      v1.1 (registro cotidiano) supera el gate: separación 14,5 en holdout. La guía quita bien
      los tics de formato y no arregla el ritmo: cuatro versiones de la guía y nueve redacciones
      de la instrucción, ninguna mejor que no decir nada. El ritmo pasa al revisor (docs/decisions.md).
  - id: B5
    title: Integraciones
    objective: Pre-commit, GitHub Action, Claude Code y paridad E2E.
    depends_on: [B3]
    deliverables:
      - .pre-commit-hooks.yaml (raíz) e integrations/pre-commit/README.md
      - integrations/github-action (action.yml, main.mjs, README)
      - integrations/claude-code como plugin: plugin.json, commands/revisar.md, skills/, hooks/hooks.json, scripts/revisar-respuesta.mjs
      - instalación del plugin en ~/.claude (fuera del repo, requiere permiso del propietario)
    tests:
      - E2E de cada adaptador con entorno simulado; test de paridad JSON entre CLI, Action y bundle
    acceptance: mismos hallazgos byte a byte en las tres superficies.
    status: done
    notes: >-
      14 tests E2E en packages/linter/test/integraciones.e2e.test.ts. El hook Stop viene apagado
      (IA_LINTER_REVISAR) y tiene tope de reintentos por prompt_id para no dejar la sesión en bucle.

  - id: B6
    title: Cierre
    objective: Seguridad, rendimiento, multiplataforma, empaquetado, release reproducible.
    depends_on: [B4, B5]
    deliverables:
      - CHANGELOG.md, SECURITY.md, CONTRIBUTING.md, LICENSE, README.md, ia-linter.yml
      - scripts/pack-check.mjs y el paso correspondiente en CI
      - project/EVIDENCE/B5-B6-cierre.md
    tests:
      - pnpm pack + instalación en temporal + ejecución; gate de rendimiento; pnpm lint:self
    acceptance: criterios §17 con evidencia; pendientes solo acciones externas del propietario.
    status: done
    notes: >-
      Todos los gates en verde en Windows. macOS y Linux quedan cubiertos por el workflow de CI,
      cuya evidencia depende del primer push. Pendientes del propietario: push, npm publish e
      instalación del plugin en ~/.claude.

  # Fase 2: el circuito de reescritura. Detalle, decisiones D1 a D3 y tabla de archivos en project/PLAN.md.
  - id: B7
    title: Cerrar el trabajo pendiente
    objective: Revisar, probar y commitear los 15 archivos modificados antes de abrir nada nuevo.
    depends_on: [B6]
    deliverables:
      - diff actual de packages/linter/src y scripts/gates.mjs, con un test para cada cambio
      - entrada en docs/decisions.md sobre fs en la API, o comentario corregido en gates.mjs
    tests:
      - pnpm typecheck, build, test, gates, lint:self y pack:check
    acceptance: git status limpio tras el commit del propietario; gates en verde.
    status: done
    notes: Commit 5daad1c. typecheck, build, 77 tests, gates, lint:self y pack:check en verde.

  - id: B8
    title: Ritmo solo donde separa
    objective: estructura/ritmo-plano deja de estar activa en el perfil correo (decisión D1, tomada 2026-09-18); sigue en chat, readme y redes.
    depends_on: [B7]
    deliverables:
      - rules/definitions/estructura--ritmo-plano.yml (profiles)
      - docs/decisions.md y docs/rules.md regenerado
      - benchmark/reports/development-v1.2-correo.json y anexo en benchmark/reports/v1.2.md
    tests:
      - gates; el holdout v1.1, evaluado con perfil chat, no cambia
    acceptance: decisión registrada; los informes de holdout v1.2 no se regeneran.
    status: done
    notes: >-
      D1 tomada el 2026-09-18: fuera solo de correo. Readme se probó sin la regla y se descartó
      (mismas falsas alarmas humanas, menos IA detectada). Cifras en docs/decisions.md y en el anexo de v1.2.md.

  - id: B9
    title: Adjudicación de development v1.2
    objective: Precisión adjudicada por regla en correo, readme y redes para poder promover o retirar reglas (decisión D2).
    depends_on: [B8]
    deliverables:
      - opción --annotations en benchmark run
      - benchmark/annotations/v1.2/{correo,readme,redes}.yml
      - informes de development v1.2 con precisión y propuestas de promoción decididas
      - docs/benchmark.md
    tests:
      - benchmark run sin --annotations da la salida de antes; con --annotations lee solo ese archivo
    acceptance: stable dentro de los límites de quality-policy.yml (23 a 30 desde el cierre de B9); cada cambio de estado con su entrada en docs/decisions.md.
    status: done
    notes: >-
      D2: adjudicó GPT-5.6 Sol en ChatGPT a ciegas (declarado por el propietario); 13 correct y 37 incorrect,
      con el único dudoso (s-010) resuelto por el propietario como incorrect. Estado: pregunta-retorica-apertura
      y encabezado-title-case bajan a candidate, stable_min pasa de 24 a 23 (quedan 23 stable) y
      comillas-angulares se apaga en correo. Ninguna candidate promovida. Las tres reglas de longitud de frase
      no se adjudican. Todos los gates en verde.

  - id: B10
    title: Reporter de revisión y adaptadores
    objective: Que el hook, /revisar y la skill den al modelo fragmento, regla y rewrite_guidance.
    depends_on: [B9]
    deliverables:
      - reporter revision (reporters, cli y config)
      - integrations/claude-code/scripts/revisar-respuesta.mjs, commands/revisar.md y skills/escribir-en-espanol/SKILL.md
      - docs/configuration.md
    tests:
      - unitario del reporter; E2E de la CLI con --format revision; E2E del hook revisados a mano; paridad JSON sin cambios
    acceptance: el JSON de lint sale igual byte a byte; SCHEMA_VERSION sigue en 1.
    status: pending

  - id: B11
    title: Situaciones y exportación a otros asistentes
    objective: Comprobar que guía y perfiles cuadran por situación y exportar la guía para el AGENTS.md de otros proyectos.
    depends_on: [B10]
    deliverables:
      - packages/linter/rules/situaciones.yml
      - gates situaciones y agents-md en scripts/gates.mjs
      - integrations/agents-md/{build.mjs,escribir-en-espanol.md,README.md}
    tests:
      - los dos gates pasan, y fallan cuando se rompen a propósito
    acceptance: humano.md sigue escrita a mano; ningún tercer sitio declara perfiles.
    status: pending

  - id: B12
    title: Corpus v1.3 con clase IA externa
    objective: Clase IA de un proveedor distinto de Claude y un holdout nuevo sin usar (decisión D3).
    depends_on: [B9]
    deliverables:
      - corpus/policy/prompts-v1.3.yml y corpus-v1.3/ con manifiestos
      - benchmark/configs/holdout-v1.3.lock
      - scripts/corpus-check.mjs con v1.3
    tests:
      - corpus-check con v1.3; solo se ejecuta development
    acceptance: la generación la hace el propietario; ninguna clave en el repositorio.
    status: pending

  - id: B13
    title: Cierre de la fase 2
    objective: Bundles, versión 1.1.0, evidencia y estado.
    depends_on: [B11]
    deliverables:
      - bundles de integrations regenerados
      - CHANGELOG.md y versión 1.1.0
      - project/EVIDENCE/B7-B13-fase2.md y project/STATE.md
    tests:
      - todos los gates, lint:self y pack:check
    acceptance: solo quedan push, release y npm publish, que hace el propietario.
    status: pending
