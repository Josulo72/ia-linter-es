schema_version: 1
id: retorica/no-es-x-es-y
revision: 1
status: candidate
title: Negación-redefinición «no es X, es Y»
summary: Niega algo que nadie había dicho para presentar lo propio como revelación («no es un gasto, es una inversión»).
category: retorica
scope: sentence
detector: regex
conditions:
  patterns:
    - "\\bno (?:es|son|era|fue) [^.;,:\\n]{2,45}[,:;] (?:es|son|sino)\\b"
    - "\\bno es que [^.\\n]{3,50}\\. (?:es|son)\\b"
default_level: warning
score: { weight: 2, cap: 3 }
message: "Negación-redefinición: «{term}»."
explanation: >-
  Es la fórmula más repetida del texto generado actual. Una persona la usa para corregir un dato concreto
  («Endesa no es distribuidora, es comercializadora»); la máquina, para dar solemnidad a cualquier frase.
rewrite_guidance: Di directamente la segunda parte. «No es un gasto, es una inversión» → «Se amortiza en dos años».
examples:
  positive:
    - { text: "Caminar no es un lujo, es una necesidad.", expect: 1 }
    - { text: "No es que gastes mucho. Es que no sabes en qué.", expect: 1 }
  negative:
    - { text: "No es fácil pero es necesario.", expect: 0 }
    - { text: "El informe no es definitivo y habrá que revisarlo.", expect: 0 }
provenance:
  evidence: Exploración sobre development y sobre el README de un proyecto real (2026-09-17); ver benchmark/reports/v1.1.md.
  known_false_positives:
    - Corrección real de un dato («no es distribuidora, es comercializadora»).
  reviewed_by: [jrollon]
