schema_version: 1
id: formato/lista-negrita-inicial
revision: 1
status: stable
title: Lista con negrita inicial en cada elemento
summary: Tres o más elementos consecutivos de lista con el patrón «**Título:** explicación».
category: formato
scope: block
detector: structure
conditions:
  kind: list_bold_lead
  min_consecutive: 3
default_level: info
score: { weight: 1.5, cap: 2 }
message: "{count} elementos de lista con negrita inicial («**Título:** texto»)."
explanation: >-
  El patrón «- **Concepto:** explicación» repetido en cada viñeta es el formato por defecto de las listas
  generadas en Markdown. En documentación escrita a mano aparece de forma ocasional, no sistemática.
rewrite_guidance: Usa una lista de definiciones, subencabezados o frases completas sin negrita de arranque.
examples:
  positive:
    - { text: "- **Velocidad:** es rápido.\n- **Precio:** es barato.\n- **Soporte:** responde.\n", expect: 1, format: markdown }
    - { text: "1. **Planifica** la semana.\n2. **Ejecuta** el plan.\n3. **Revisa** los resultados.\n", expect: 1, format: markdown }
  negative:
    - { text: "- Velocidad: es rápido.\n- Precio: es barato.\n- Soporte: responde.\n", expect: 0, format: markdown }
    - { text: "- **Velocidad:** es rápido.\n- Precio: es barato.\n- **Soporte:** responde.\n", expect: 0, format: markdown }
provenance:
  evidence: Frecuencia relativa en corpus propio (development); ver benchmark/reports/development-v1.0.json.
  known_false_positives:
    - Documentación técnica humana con glosarios en formato «**término:** definición».
  reviewed_by: [jrollon]
profiles:
  tecnico: off
