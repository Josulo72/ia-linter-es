schema_version: 1
id: estructura/ritmo-metronomo
revision: 1
status: candidate
title: Ritmo de metrónomo
summary: Las frases alternan largo y corto con demasiada regularidad, como si siguieran una plantilla.
category: estructura
scope: document
detector: structure
conditions:
  kind: sentence_length_alternation
  min_sentences: 8
  min_alternation: 0.85
  min_cv: 0.50
default_level: "off"
profiles: { chat: warning, correo: warning, readme: warning, redes: warning }
score: { weight: 2, cap: 2 }
message: "Ritmo de metrónomo: la longitud sube y baja alternando en el {rate} % de las frases."
explanation: >-
  Es el defecto contrario a `estructura/ritmo-plano` y aparece cuando se le pide al modelo que varíe el ritmo con
  una regla numérica. Sale una cadencia de larga-corta-larga-corta que no comete una persona. Se exigen las dos
  cosas a la vez, alternancia de 0,85 y variación de longitud de 0,50, porque un texto plano oscila una palabra
  arriba y abajo y alternaría al 100 % sin ser un metrónomo. En 36 mensajes de foro no marca ninguno; en los 96
  textos de la clase IA sin esa instrucción, tampoco; en los 8 generados con ella, 6.
rewrite_guidance: Pon dos frases seguidas de longitud parecida en algún punto. La irregularidad es lo natural, no el vaivén.
examples:
  positive:
    - { text: "Me han ofrecido un trabajo en otra ciudad con bastante mejor sueldo y más responsabilidad de la que tengo ahora mismo. En principio suena bien. Significa dejar el piso, a los amigos de siempre y a mi pareja, que no se puede mover de aquí por su trabajo. No lo tengo nada claro. El sueldo sube unos cuatrocientos euros al mes, que tampoco es una barbaridad para todo lo que supone el cambio. Ahí está mi duda. Llevo desde el jueves dándole vueltas al asunto sin llegar a ninguna parte concreta ni ver la cosa clara. Nunca me había pasado esto. Si alguien ha vivido algo parecido y quiere contarlo por aquí se lo agradezco mucho de antemano. Gracias por leerme.", expect: 1 }
    - { text: "Llevo tres meses esperando a que el casero me devuelva la fianza del piso donde estuve viviendo el año pasado entero. Ya van noventa días. Le enseñé las fotos de todas las habitaciones el día que me fui, todo limpio y sin una sola rotura por ningún lado. Dijo que estaba bien. Cada vez que le llamo me cuenta que hay que hacer reformas y que el dinero se va a ir entero en eso. Yo tengo pruebas. Estoy pensando en reclamar por consumo a ver si de esa manera se mueve un poco el asunto. Me da bastante rabia. Alguien que haya pasado por esto mismo que me diga si merece la pena meterse en ese lío.", expect: 1 }
  negative:
    - { text: "Pues yo lo probé el año pasado y me costó bastante cogerle el punto al principio, sobre todo con los tiempos de fermentación de la masa. No salió. Lo tiré entero y volví a empezar de cero con otra receta distinta que encontré en un foro parecido a este. Al segundo intento ya fue otra cosa bastante mejor, aunque tampoco para tirar cohetes. La miga seguía quedando algo densa para mi gusto. El sabor en cambio estaba conseguido y la corteza quedó como tenía que quedar, crujiente y oscura. Ahora sale bien casi siempre. Cuestión de práctica, supongo. Yo tardé un mes largo en cogerle el aire a la masa y todavía me sale mejor unos días que otros.", expect: 0 }
    - { text: "Tengo un problema con el coche y la verdad es que no sé muy bien por dónde tirar, a ver si alguien me puede echar un cable con esto. Hace un ruido raro al arrancar en frío. Es como un chirrido corto que dura un par de segundos y después desaparece del todo sin dejar rastro. En caliente no lo hace nunca, ni subiendo cuestas ni con el aire puesto. El mecánico del barrio dice que es la correa. Dice también que no corre ninguna prisa cambiarla todavía y que aguanta perfectamente hasta la próxima revisión. No me fío demasiado de esa respuesta. Llevo ya dos semanas igual. El coche tiene doce años y cien mil kilómetros encima.", expect: 0 }
provenance:
  evidence: 36 mensajes de foro, 96 textos de la clase IA y 8 generados con instrucción numérica de ritmo; ver benchmark/reports/v1.1.md.
  known_false_positives:
    - Textos muy cortos, donde pocas frases bastan para alcanzar la proporción.
    - Diálogos o listas de preguntas y respuestas, donde el vaivén de longitud viene de la forma del texto.
  reviewed_by: [jrollon]
