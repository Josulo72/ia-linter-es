# Prompts de la clase IA v1.2 (registros correo, readme y redes). Cada tema se genera dos veces:
#   - base:   solo el encargo, como lo pediría cualquiera. Clase IA de development y holdout.
#   - guiada: el mismo encargo precedido de la guía integrations/claude-code/output-styles/humano.md. Va a challenge.
# Generación: subagentes de Claude Code (Agent tool), un subagente por lote de 10 textos del mismo modelo, registro y condición;
# el prompt de sistema y los parámetros son los del arnés y no son visibles. Límite: los textos de un lote comparten contexto.
# Los temas se escribieron antes de mirar los textos humanos descargados y no salen de ellos.
# Reintentos: 33 textos de la primera tanda salieron por debajo de las 150 palabras que pide la plantilla
# (todo el lote correo/haiku en las dos condiciones, tres de correo/sonnet/guiada y diez de redes/haiku).
# Se volvieron a generar con el mismo encargo y un recordatorio del mínimo de palabras, no por su estilo.
schema_version: 1
generated: "2026-09-18"
provider: Anthropic
harness: Claude Code subagent (Agent tool), lotes de 10
templates:
  correo: "Escribe un correo electrónico en español. {tema} Entre 150 y 400 palabras. Solo el texto del correo, con su saludo y su despedida."
  readme: "Escribe en Markdown el README de un proyecto de software libre en español. {tema} Entre 200 y 500 palabras. Solo el texto del README."
  redes: "Escribe un hilo para una red social en español: varias publicaciones cortas seguidas, separadas por una línea en blanco. {tema} Entre 150 y 350 palabras en total. Solo el texto del hilo."
guide: integrations/claude-code/output-styles/humano.md
