# Prompts de la clase IA v1.3 (registros correo, readme y redes), generada con un modelo de otro proveedor (D3).
# Mismos 90 temas, plantillas y particiones que v1.2 (corpus/policy/prompts-v1.2.yml), para que la única diferencia sea
# el modelo. Cada tema se genera dos veces:
#   - base:   solo el encargo. Clase IA de development y holdout.
#   - guiada: el mismo encargo precedido de la guía (integrations/claude-code/guia/humano.md). Va a challenge.
# Generación: la hace el propietario a mano en ChatGPT, con GPT-5.6 Sol, en lotes de 5 encargos del mismo registro,
# condición y partición, cada lote en una conversación nueva y temporal (sin memoria ni instrucciones personalizadas).
# Los lotes y el texto exacto de cada uno salen de benchmark/scripts/generacion-v1.3.mjs encargos (corpus-v1.3/ENCARGOS.md).
# Solo para el corpus de evaluación: GPT-5.6 Sol no forma parte del producto (docs/decisions.md).
# Ninguna clave ni credencial se guarda en el repositorio.
schema_version: 1
generated: pendiente
provider: OpenAI
model: GPT-5.6 Sol
interface: ChatGPT (web), conversación temporal nueva por lote
system_prompt: el de ChatGPT; no visible
parameters: los de la interfaz; no visibles ni controlables
lote: 5
templates:
  correo: Escribe un correo electrónico en español. {tema} Entre 150 y 400 palabras. Solo el texto del correo, con su saludo y su despedida.
  readme: Escribe en Markdown el README de un proyecto de software libre en español. {tema} Entre 200 y 500 palabras. Solo el texto del README.
  redes: "Escribe un hilo para una red social en español: varias publicaciones cortas seguidas, separadas por una línea en blanco. {tema} Entre 150 y 350 palabras en total. Solo el texto del hilo."
guided_prefix: "Sigue esta guía de estilo al escribir:"
guide: integrations/claude-code/guia/humano.md
guide_sha256: 0c8ebaafd6ded1760495fcf51aa09ad186ee4bfe8e079be86f0e62b1c8ed715b
batch_intro: "Te voy a pedir {n} textos distintos. Cada uno es un encargo independiente: no se continúan entre sí ni comparten personajes. Escribe cada texto exactamente como se pide y nada más. Devuélvelos seguidos, cada uno precedido de una línea con su identificador tal cual, entre tres signos igual, por ejemplo: === {ejemplo} ===. No añadas títulos, comentarios ni explicaciones, ni antes del primer identificador ni después del último."
